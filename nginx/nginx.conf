# Konfigurasi reverse proxy untuk Raia (ran.teknoloka.id)
#
# Deploy dengan HTTPS:
#   1. Jalankan certbot di host (bukan di container nginx ini) untuk
#      menghasilkan sertifikat:
#        certbot --nginx -d ran.teknoloka.id -d www.ran.teknoloka.id
#      Certbot akan menambahkan blok `listen 443 ssl` + `ssl_certificate`
#      secara otomatis. Sertifikat TIDAK disimpan di repo ini.
#   2. Setelah itu, aktifkan redirect HTTP -> HTTPS di server block bawah
#      (lihat komentar "HTTP -> HTTPS" di dalam blok).
#
# docker-compose membuka port 80 dan 443 pada container nginx.

server {
    listen 80;
    server_name ran.teknoloka.id www.ran.teknoloka.id;

    # Batas upload (dokumen KYC, foto ternak, dll.)
    client_max_body_size 20M;

    # HTTP -> HTTPS: aktifkan setelah certbot mengeluarkan sertifikat.
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

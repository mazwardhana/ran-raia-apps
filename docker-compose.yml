name: raia

services:
  postgres:
    image: postgres:16-alpine
    container_name: raia-postgres
    environment:
      POSTGRES_USER: raia
      POSTGRES_PASSWORD: raia_password
      POSTGRES_DB: raia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raia -d raia"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ran-network

  minio:
    image: minio/minio:latest
    container_name: raia-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: raia_minio
      MINIO_ROOT_PASSWORD: raia_minio_secret_123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - ran-network

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raia-nextjs
    environment:
      DATABASE_URL: postgresql://raia:raia_password@postgres:5432/raia
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - ran-network

  nginx:
    image: nginx:1.27-alpine
    container_name: raia-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nextjs
    networks:
      - ran-network

volumes:
  postgres_data:
  minio_data:

networks:
  ran-network:
    name: ran-network
    driver: bridge
name: CI

on:
  push:
    branches: [main, feature/raia-mvp]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: raia
          POSTGRES_PASSWORD: raia_password
          POSTGRES_DB: raia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raia -d raia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://raia:raia_password@localhost:5432/raia
      AUTH_SECRET: ci-test-secret
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate & push schema
        run: |
          npx prisma generate
          npx prisma db push

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
